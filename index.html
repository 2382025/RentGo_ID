   ============================================================ */
function formatDateOnly(d){
  return new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
}
function periodOf(iso){
  const d=new Date(iso);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function periodLabel(p){
  const [y,m]=p.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'});
}
// Jatuh tempo komisi periode P = tanggal "dueDay" bulan berikutnya
function periodDueDate(p){
  const [y,m]=p.split('-').map(Number);
  return new Date(y,m,(state.settings&&state.settings.dueDay)||5,23,59,59);
}
function isPeriodOverdue(p){ return Date.now()>periodDueDate(p).getTime(); }
function isUserSuspended(id){
  const u=state.users.find(x=>x.id===id);
  return !!(u&&u.suspended);
}
function sellerUnpaidRentals(sellerId){
  return state.rentals.filter(r=>r.sellerId===sellerId&&r.status==='completed'&&!r.commissionPaid&&!r.commissionPending);
}
function groupByPeriod(rentals){
  const map={};
  rentals.forEach(r=>{const p=periodOf(r.completedAt||r.createdAt);(map[p]=map[p]||[]).push(r);});
  return map;
}
function commissionStatusText(r){
  if(r.commissionPaid)return '✓ Komisi sudah dibayar';
  if(r.commissionPending)return '⏳ Komisi menunggu verifikasi admin';
  return `Tagihan Komisi: ${rupiah(r.commission||0)}`;
}
function notifyAdmins(type,title,message,link){
  state.users.filter(u=>u.role==='admin').forEach(a=>pushNotif(a.id,type,title,message,null,link||null));
}
function openCommissionProof(id){
  const c=state.commissionPayments.find(x=>x.id===id);
  if(c&&c.proofPhoto)openLightbox(c.proofPhoto);
}
function openModal(html,opts){
  opts=opts||{};
  const o=document.createElement('div');
  o.className='modal-overlay';
  o.innerHTML=`<div class="modal ${opts.lg?'modal-lg':''}" ${opts.maxWidth?`style="max-width:${opts.maxWidth}"`:''}>${html}</div>`;

  o.querySelectorAll('.modal-close, .modal-close-btn').forEach(b=>b.onclick=()=>o.remove());
  return o;
}
function downloadCSV(filename,headers,rows){
  const clean=(c)=>{let s=String(c==null?'':c);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
  const csv=[headers,...rows].map(r=>r.map(clean).join(',')).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
  toast('File CSV berhasil diunduh','success');
}
const todayStamp=()=>new Date().toISOString().slice(0,10);

/* --- Logika bisnis komisi (dipisah dari UI) --- */
function submitCommissionPayment(sellerId,period,proofPhoto){
  const rentals=sellerUnpaidRentals(sellerId).filter(r=>periodOf(r.completedAt||r.createdAt)===period);
  if(rentals.length===0||!proofPhoto)return null;
  const now=new Date().toISOString();
  const cp={
    id:uid('cp'),sellerId,period,rentalIds:rentals.map(r=>r.id),
    amount:rentals.reduce((s,r)=>s+(r.commission||0),0),
    proofPhoto,status:'pending',submittedAt:now,
    reviewedAt:null,reviewedBy:null,adminNote:'',manual:false
  };
  state.commissionPayments.push(cp);
  rentals.forEach(r=>{r.commissionPending=true;r.commissionPaymentId=cp.id;});
  saveState();
  const seller=state.users.find(u=>u.id===sellerId);
  notifyAdmins('payment','Bukti Komisi Masuk',`${seller?seller.name:'Seller'} mengirim bukti komisi ${periodLabel(period)} sebesar ${rupiah(cp.amount)}. Menunggu verifikasi.`,'admin:commissions');
  return cp;
}

function adminVerifyCommission(id,note){
  const cp=state.commissionPayments.find(x=>x.id===id);
  if(!cp||cp.status!=='pending')return false;
  const now=new Date().toISOString();
  cp.status='verified';cp.reviewedAt=now;cp.reviewedBy=state.currentUser.id;cp.adminNote=note||'';
  cp.rentalIds.forEach(rid=>{
    const r=state.rentals.find(x=>x.id===rid);
    if(r){r.commissionPaid=true;r.commissionPending=false;r.commissionPaidAt=now;}
  });
  const seller=state.users.find(u=>u.id===cp.sellerId);
  logAdmin('Verifikasi komisi',`${seller?seller.name:'-'} · ${periodLabel(cp.period)} · ${rupiah(cp.amount)}`);
  saveState();
  pushNotif(cp.sellerId,'payment','Komisi Diverifikasi',`Pembayaran komisi ${periodLabel(cp.period)} (${rupiah(cp.amount)}) telah diverifikasi admin. Terima kasih!`);
  return true;
}

function adminRejectCommission(id,reason){
  const cp=state.commissionPayments.find(x=>x.id===id);
  if(!cp||cp.status!=='pending')return false;
  const now=new Date().toISOString();
  cp.status='rejected';cp.reviewedAt=now;cp.reviewedBy=state.currentUser.id;cp.adminNote=reason||'';
  cp.rentalIds.forEach(rid=>{
    const r=state.rentals.find(x=>x.id===rid);
    if(r){r.commissionPending=false;r.commissionPaymentId=null;}
  });
  const seller=state.users.find(u=>u.id===cp.sellerId);
  logAdmin('Tolak bukti komisi',`${seller?seller.name:'-'} · ${periodLabel(cp.period)} · Alasan: ${reason}`);
  saveState();
  pushNotif(cp.sellerId,'danger','Bukti Komisi Ditolak',`Bukti komisi ${periodLabel(cp.period)} ditolak: ${reason}. Silakan unggah ulang bukti yang sesuai.`);
  return true;
}

function adminMarkBillPaid(sellerId,period,note){
  const rentals=sellerUnpaidRentals(sellerId).filter(r=>periodOf(r.completedAt||r.createdAt)===period);
  if(rentals.length===0)return false;
  const now=new Date().toISOString();
  const cp={
    id:uid('cp'),sellerId,period,rentalIds:rentals.map(r=>r.id),
    amount:rentals.reduce((s,r)=>s+(r.commission||0),0),
    proofPhoto:null,status:'verified',submittedAt:now,reviewedAt:now,reviewedBy:state.currentUser.id,
    adminNote:note||'Ditandai lunas manual oleh admin',manual:true
  };
  state.commissionPayments.push(cp);
  rentals.forEach(r=>{r.commissionPaid=true;r.commissionPending=false;r.commissionPaidAt=now;r.commissionPaymentId=cp.id;});
  const seller=state.users.find(u=>u.id===sellerId);
  logAdmin('Tandai lunas manual',`${seller?seller.name:'-'} · ${periodLabel(period)} · ${rupiah(cp.amount)} · ${cp.adminNote}`);
  saveState();
  pushNotif(sellerId,'payment','Komisi Dinyatakan Lunas',`Komisi ${periodLabel(period)} (${rupiah(cp.amount)}) dinyatakan lunas oleh admin.`);
  return true;
}

          <h2 style="font-size:28px;font-weight:800;color:var(--danger)" id="commTotal">${rupiah(sumFor(selected))}</h2>
        </div>
        <div class="bank-info-card" style="background:#f8fafc">
          <div class="head"><h4>Transfer ke Rekening Platform:</h4></div>
          <div class="row"><span class="label">Bank</span><span class="val">${esc(PLATFORM_BANK.bankName)}</span></div>
          <div class="row"><span class="label">No. Rekening</span><span class="val">${esc(PLATFORM_BANK.accountNumber)}</span></div>
          <div class="row"><span class="label">Atas Nama</span><span class="val">${esc(PLATFORM_BANK.accountHolder)}</span></div>
        </div>
        <div class="section-title" style="margin-top:16px">Unggah Bukti Transfer ke Platform</div>
        <div class="form-group">
          <div id="commProofArea">
            <div class="photo-upload" id="commProofUpload">
              <i class="fa-solid fa-camera"></i>
              <div class="text">Klik untuk upload bukti</div>
              <div class="sub">Pastikan nominal sesuai tagihan periode terpilih</div>
            </div>
          </div>
          <input type="file" id="commProofInput" accept="image/*" class="hidden">
        </div>
        <p style="font-size:11px;color:var(--muted);line-height:1.5">Setelah dikirim, bukti akan diperiksa oleh Admin. Status komisi berubah menjadi lunas setelah diverifikasi.</p>
      </div>
      <div class="modal-footer" style="flex-direction:column;border:none;padding-top:0">
        <button class="btn btn-primary btn-block" id="submitCommProofBtn" disabled style="padding:14px">
          <i class="fa-solid fa-paper-plane"></i> Kirim Bukti ke Admin
        </button>
        <button class="btn btn-secondary btn-block mt-2" id="closeCommBtn">Batal</button>
      </div>
  `,{maxWidth:'440px'});

  const proofInput=overlay.querySelector('#commProofInput');
  const submitBtn=overlay.querySelector('#submitCommProofBtn');

  overlay.querySelectorAll('[data-period]').forEach(el=>{
    el.onclick=()=>{
      selected=el.dataset.period;
      overlay.querySelectorAll('[data-period]').forEach(x=>x.classList.toggle('active',x===el));
      overlay.querySelector('#commTotal').textContent=rupiah(sumFor(selected));
    };
  });

  function bindUpload(){
    const up=overlay.querySelector('#commProofUpload');
    if(up)up.onclick=()=>proofInput.click();
    const rm=overlay.querySelector('.photo-preview .remove');
    if(rm)rm.onclick=(e)=>{
      e.stopPropagation();
      proofPhoto=null;
      overlay.querySelector('#commProofArea').innerHTML=`<div class="photo-upload" id="commProofUpload"><i class="fa-solid fa-camera"></i><div class="text">Klik untuk upload bukti</div></div>`;
      submitBtn.disabled=true;

    };

    const file=e.target.files[0];

    render();
  };

const RENTAL_STATUS={
  pending_payment:['Belum Bayar','red'],
  pending_verification:['Verifikasi Bayar','blue'],
  booked:['Lunas · Menunggu Diambil','amber'],
  active:['Sedang Disewa','green'],
  completed:['Selesai','green'],
  cancelled:['Dibatalkan','gray']
};

function buildBills(){
  const map={};
  state.rentals.filter(r=>r.status==='completed').forEach(r=>{
    const p=periodOf(r.completedAt||r.createdAt);
    const k=r.sellerId+'|'+p;
    const b=map[k]||(map[k]={sellerId:r.sellerId,period:p,total:0,count:0,paidAmt:0,pendingAmt:0,unpaidAmt:0,unpaidCount:0});
    const c=r.commission||0;
    b.total+=c;b.count++;
    if(r.commissionPaid)b.paidAmt+=c;
    else if(r.commissionPending)b.pendingAmt+=c;
    else{b.unpaidAmt+=c;b.unpaidCount++;}
  });
  return Object.values(map).map(b=>{
    b.overdue=b.unpaidAmt>0&&isPeriodOverdue(b.period);
    b.dueDate=periodDueDate(b.period);
    return b;
  }).sort((a,b)=>(Number(b.overdue)-Number(a.overdue))||a.period.localeCompare(b.period));
}

function adminStats(){
  const users=state.users.filter(u=>u.role!=='admin');
  const completed=state.rentals.filter(r=>r.status==='completed');
  const sum=(arr,f)=>arr.reduce((s,r)=>s+f(r),0);
  return {
    totalUsers:users.length,
    sellers:users.filter(u=>u.role==='seller').length,
    buyers:users.filter(u=>u.role==='buyer').length,
    suspended:users.filter(u=>u.suspended).length,
    motors:state.motors.length,
    blockedMotors:state.motors.filter(m=>m.adminBlocked).length,
    liveRentals:state.rentals.filter(r=>r.status==='active'||r.status==='booked').length,
    completedCount:completed.length,
    volume:sum(completed,r=>r.totalPrice||0),
    commPaid:sum(completed.filter(r=>r.commissionPaid),r=>r.commission||0),
    commPending:sum(completed.filter(r=>!r.commissionPaid&&r.commissionPending),r=>r.commission||0),
    commUnpaid:sum(completed.filter(r=>!r.commissionPaid&&!r.commissionPending),r=>r.commission||0),
    pendingSubs:state.commissionPayments.filter(c=>c.status==='pending')
  };
}

  const counts={
    pending:allSubs.filter(c=>c.status==='pending').length,
    verified:allSubs.filter(c=>c.status==='verified').length,
    rejected:allSubs.filter(c=>c.status==='rejected').length,
    all:allSubs.length
  };
  const bills=buildBills().filter(b=>b.unpaidAmt>0);
  const tabsHtml=filterTabsHtml('commFilter',f,[
    ['pending',`Menunggu (${counts.pending})`],
    ['bills',`Tagihan (${bills.length})`],
    ['verified',`Terverifikasi (${counts.verified})`],
    ['rejected',`Ditolak (${counts.rejected})`],
    ['all',`Semua (${counts.all})`]
  ]);
  const head=`
    <div class="page-title"><h1>Komisi Platform</h1><p>Verifikasi pembayaran komisi bulanan dari penyedia (${Math.round(COMMISSION_RATE*100)}% per transaksi, jatuh tempo ${esc(PLATFORM_BANK.dueDate.toLowerCase())}).</p></div>
    ${tabsHtml}
    <div class="adm-actions-bar">
      ${searchBoxHtml('commQ','Cari nama penyedia...')}
      <button class="btn-export" data-adm="exportComm"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
      ${f==='bills'&&bills.some(b=>b.overdue)?`<button class="btn btn-warning btn-sm" data-adm="remindAll"><i class="fa-solid fa-bell"></i> Ingatkan Semua yang Terlambat</button>`:''}
    </div>`;

  if(f==='bills'){
    const list=bills.filter(b=>!q||sellerName(b.sellerId).toLowerCase().includes(q));
    if(list.length===0)return head+`<div class="empty"><i class="fa-solid fa-circle-check"></i><h3>Tidak ada tagihan tertunggak</h3><p>Semua komisi sudah dibayar atau sedang diverifikasi.</p></div>`;
    return head+`<div class="history-list">${list.map(b=>`
      <div class="history-item ${b.overdue?'overdue':'pending'}">
        <div class="history-icon ${b.overdue?'overdue':'pending'}"><i class="fa-solid ${b.overdue?'fa-triangle-exclamation':'fa-file-invoice'}"></i></div>
        <div class="history-info">
          <h4>${esc(sellerName(b.sellerId))} — ${esc(periodLabel(b.period))}</h4>
          <p>${b.unpaidCount} transaksi belum dibayar · Jatuh tempo ${formatDateOnly(b.dueDate)}</p>
          ${b.pendingAmt>0?`<p>${rupiah(b.pendingAmt)} sedang menunggu verifikasi</p>`:''}
          <div class="adm-actions">
            <button class="btn btn-secondary btn-xs" data-adm="remind" data-seller="${b.sellerId}" data-period="${b.period}"><i class="fa-solid fa-bell"></i> Ingatkan</button>
            <button class="btn btn-success btn-xs" data-adm="markPaid" data-seller="${b.sellerId}" data-period="${b.period}"><i class="fa-solid fa-check"></i> Tandai Lunas</button>
          </div>
        </div>
        <div class="history-meta">
          <div class="price" style="color:var(--danger)">${rupiah(b.unpaidAmt)}</div>
          <div class="date">${b.overdue?'<span class="chip red">Terlambat</span>':'<span class="chip amber">Belum bayar</span>'}</div>
        </div>
      </div>`).join('')}</div>`;
  }

  let list=allSubs;
  if(f!=='all')list=list.filter(c=>c.status===f);
  if(q)list=list.filter(c=>sellerName(c.sellerId).toLowerCase().includes(q));
  if(list.length===0)return head+`<div class="empty"><i class="fa-solid fa-file-invoice-dollar"></i><h3>Tidak ada data</h3><p>Belum ada pengajuan pada kategori ini.</p></div>`;
  const map={pending:['Menunggu','verify','fa-hourglass-half','amber'],verified:['Terverifikasi','','fa-circle-check','green'],rejected:['Ditolak','overdue','fa-circle-xmark','red']};
  return head+`<div class="history-list">${list.map(c=>{
    const st=map[c.status];
    return `
      <div class="history-item ${st[1]}">
        <div class="history-icon ${st[1]||'active'}"><i class="fa-solid ${st[2]}"></i></div>
        <div class="history-info">
          <h4>${esc(sellerName(c.sellerId))} — ${esc(periodLabel(c.period))}</h4>
          <p>${c.rentalIds.length} transaksi · Dikirim ${formatDate(c.submittedAt)}${c.manual?' · manual':''}</p>
          ${c.reviewedAt?`<p>Diproses ${formatDate(c.reviewedAt)}${c.adminNote?` · ${esc(c.adminNote)}`:''}</p>`:''}
        </div>
        <div class="history-meta">
          <div class="price">${rupiah(c.amount)}</div>
          <div class="date"><span class="chip ${st[3]}">${st[0]}</span></div>
          <button class="btn ${c.status==='pending'?'btn-primary':'btn-secondary'} btn-xs mt-2" data-adm="commView" data-id="${c.id}"><i class="fa-solid fa-eye"></i> ${c.status==='pending'?'Cek Bukti':'Detail'}</button>
        </div>
      </div>`;
  }).join('')}</div>`;
}

function adminToggleSuspend(id){
  const u=state.users.find(x=>x.id===id);
  if(!u||u.role==='admin')return;
  if(u.suspended){
    if(!confirm(`Aktifkan kembali akun ${u.name}?`))return;
    u.suspended=false;u.suspendReason='';
    logAdmin('Aktifkan akun',u.name);
    saveState();
    toast('Akun diaktifkan kembali','success');
  } else {
    const live=state.rentals.some(r=>(r.buyerId===u.id||r.sellerId===u.id)&&(r.status==='active'||r.status==='booked'));
    const reason=prompt(`Alasan menangguhkan ${u.name}?${live?'\n\nPERHATIAN: pengguna ini masih punya rental berjalan.':''}`);
    if(reason===null)return;
    if(!reason.trim()){toast('Alasan wajib diisi','error');return;}
    u.suspended=true;u.suspendReason=reason.trim();
    logAdmin('Tangguhkan akun',`${u.name} · ${u.suspendReason}`);
    saveState();
    toast('Akun ditangguhkan','warning');
  }
  render();
}

function adminResetPassword(id){
  const u=state.users.find(x=>x.id===id);
  if(!u||u.role==='admin')return;
  if(!confirm(`Reset password ${u.name}? Password lama tidak berlaku lagi.`))return;
  const chars='abcdefghjkmnpqrstuvwxyz23456789';
  const arr=new Uint32Array(8);
  (window.crypto||window.msCrypto).getRandomValues(arr);
  const tmp=Array.from(arr).map(n=>chars[n%chars.length]).join('');
  u.password=tmp;
  logAdmin('Reset password',u.name);
  saveState();
  openModal(`
    <div class="modal-header"><h3>Password Sementara</h3><button class="modal-close"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body" style="text-align:center">
      <p style="font-size:13px;color:var(--muted);margin-bottom:10px">Berikan password ini ke <strong>${esc(u.name)}</strong> dan minta segera menggantinya.</p>
      <div style="font-size:26px;font-weight:800;letter-spacing:3px;padding:16px;background:var(--bg);border-radius:12px;font-family:monospace">${tmp}</div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary modal-close-btn">Tutup</button></div>
  `,{maxWidth:'380px'});
}

    saveState();
    pushNotif(m.sellerId,'booking','Motor Dibuka Kembali',`Blokir pada ${m.name} telah dicabut admin.`);
    toast('Blokir dibuka','success');
  } else {
    const reason=prompt(`Alasan memblokir ${m.name}?`);

function adminDeleteMotor(id){
  const m=state.motors.find(x=>x.id===id);
  if(!m)return;
  if(isMotorRented(id)){toast('Tidak bisa menghapus motor yang sedang disewa','error');return;}
  if(!confirm(`Hapus permanen ${m.name} milik ${sellerName(m.sellerId)}?`))return;
  state.motors=state.motors.filter(x=>x.id!==id);
  logAdmin('Hapus motor',`${m.name} (${sellerName(m.sellerId)})`);
  saveState();
  pushNotif(m.sellerId,'danger','Motor Dihapus Admin',`${m.name} telah dihapus dari platform oleh admin.`);
  toast('Motor dihapus','success');
  render();
}

            <p>${formatDate(r.createdAt)} · ${r.durationHours} jam</p>
          </div>
          <div class="history-meta">
            <div class="price">${rupiah(r.totalPrice)}</div>
            <button class="btn btn-secondary btn-xs mt-2" data-adm="rentalDetail" data-id="${r.id}"><i class="fa-solid fa-eye"></i> Detail</button>
          </div>
        </div>`;
    }).join('')}</div>`}
  `;
}

function openAdminRentalDetail(id){
  const r=state.rentals.find(x=>x.id===id);
  if(!r)return;
  const m=state.motors.find(x=>x.id===r.motorId);
  const rs=RENTAL_STATUS[r.status]||[r.status,'gray'];
  const cancellable=['pending_payment','pending_verification','booked'].includes(r.status);
  const o=openModal(`
    <div class="modal-header"><h3>Detail Transaksi</h3><button class="modal-close"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body">
      <div style="text-align:center;margin-bottom:14px"><span class="chip ${rs[1]}">${rs[0]}</span></div>
      <div class="kv"><span>ID</span><span>#${esc(r.id.slice(-8))}</span></div>
      <div class="kv"><span>Motor</span><span>${esc(m?m.brand+' '+m.name:'-')}</span></div>
      <div class="kv"><span>Penyewa</span><span>${esc(sellerName(r.buyerId))}</span></div>
      <div class="kv"><span>Penyedia</span><span>${esc(sellerName(r.sellerId))}</span></div>
      <div class="kv"><span>Durasi</span><span>${r.durationHours} jam</span></div>
      <div class="kv"><span>Total</span><span>${rupiah(r.totalPrice)}</span></div>
      <div class="kv"><span>Dibuat</span><span>${formatDate(r.createdAt)}</span></div>
      ${r.startTime?`<div class="kv"><span>Mulai</span><span>${formatDate(r.startTime)}</span></div>`:''}
      ${r.completedAt?`<div class="kv"><span>Selesai</span><span>${formatDate(r.completedAt)}</span></div>`:''}
      ${r.status==='completed'?`<div class="kv"><span>Komisi platform</span><span>${rupiah(r.commission||0)} — ${r.commissionPaid?'Lunas':r.commissionPending?'Menunggu verifikasi':'Belum dibayar'}</span></div>`:''}
      ${r.status==='cancelled'?`<div class="kv"><span>Alasan batal</span><span>${esc(r.cancelReason||'-')}</span></div>`:''}
      ${r.paymentProofPhoto?`<div class="section-title" style="margin-top:14px">Bukti Pembayaran Penyewa</div><img class="proof-img" src="${r.paymentProofPhoto}" onclick="openLightbox(this.src)">`:''}
    </div>
    <div class="modal-footer">
      ${cancellable?`<button class="btn btn-danger" id="admCancelRental"><i class="fa-solid fa-ban"></i> Batalkan Pesanan</button>`:''}
      <button class="btn btn-secondary modal-close-btn">Tutup</button>
    </div>
  `);
  const cb=o.querySelector('#admCancelRental');
  if(cb)cb.onclick=()=>{
    const reason=prompt('Alasan pembatalan pesanan oleh admin:');
    if(reason===null)return;
    if(!reason.trim()){toast('Alasan wajib diisi','error');return;}
    r.status='cancelled';r.cancelReason=reason.trim();r.cancelledAt=new Date().toISOString();
    logAdmin('Batalkan pesanan',`#${r.id.slice(-8)} · ${m?m.name:''} · ${r.cancelReason}`);
    saveState();
    pushNotif(r.buyerId,'danger','Pesanan Dibatalkan Admin',`Pesanan ${m?m.name:'motor'} dibatalkan. Alasan: ${r.cancelReason}. Jika sudah membayar, hubungi penyedia/admin untuk pengembalian dana.`,r.id);
    pushNotif(r.sellerId,'warning','Pesanan Dibatalkan Admin',`Pesanan ${m?m.name:'motor'} dibatalkan oleh admin. Alasan: ${r.cancelReason}.`,r.id);
    o.remove();toast('Pesanan dibatalkan','warning');render();
  };
}

/* ============================================================
   ADMIN — HANDLERS
   ============================================================ */
function attachAdminHandlers(){
  document.querySelectorAll('[data-search]').forEach(inp=>{
    inp.oninput=(e)=>{
      state.adminUI[inp.dataset.search]=e.target.value;
      window._adminFocusId=inp.id;
      clearTimeout(window._searchTimer);
      window._searchTimer=setTimeout(()=>render(),250);
    };
  });
  const main=document.querySelector('.main');
  if(main){
    main.onclick=(e)=>{
      const el=e.target.closest('[data-adm]');
      if(!el)return;
      adminAction(el.dataset.adm,el.dataset);
    };
  }
  if(window._adminFocusId){
    const el=document.getElementById(window._adminFocusId);
    window._adminFocusId=null;
    if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length);}catch(err){}}
  }
}

function adminAction(action,d){
  switch(action){
    case 'goto':
      state.adminTab=d.to;
      if(d.filter)state.adminUI.commFilter=d.filter;
      render();break;
    case 'setFilter': state.adminUI[d.key]=d.val;render();break;
    case 'commView': openAdminCommissionModal(d.id);break;
    case 'remind': adminRemind(d.seller,d.period);break;
    case 'remindAll': adminRemindAll();break;
    case 'markPaid': {
      const note=prompt(`Tandai lunas manual untuk ${sellerName(d.seller)} (${periodLabel(d.period)}).\nCatatan (mis. "Setor tunai", boleh kosong):`);
      if(note===null)return;
      if(adminMarkBillPaid(d.seller,d.period,note.trim())){toast('Tagihan ditandai lunas','success');render();}
      break;
    }
    case 'userDetail': openAdminUserDetail(d.id);break;
    case 'userSuspend': adminToggleSuspend(d.id);break;
    case 'userReset': adminResetPassword(d.id);break;
    case 'motorBlock': adminToggleMotorBlock(d.id);break;
    case 'motorDelete': adminDeleteMotor(d.id);break;
    case 'rentalDetail': openAdminRentalDetail(d.id);break;
    case 'reviewDelete': {
      if(!confirm('Hapus ulasan ini?'))return;
      const rv=state.reviews.find(x=>x.id===d.id);
      state.reviews=state.reviews.filter(x=>x.id!==d.id);
      logAdmin('Hapus ulasan',rv?`${sellerName(rv.buyerId)} · ${rv.rating}/5 · ${(rv.comment||'').slice(0,60)}`:'');
      saveState();toast('Ulasan dihapus','success');render();break;
    }
    case 'exportComm': adminExportCommissions();break;
    case 'exportUsers': adminExportUsers();break;
    case 'exportRentals': adminExportRentals();break;
    case 'exportLogs':
      downloadCSV(`RentGo_LogAdmin_${todayStamp()}.csv`,['Waktu','Admin','Aksi','Detail'],
        state.auditLogs.map(l=>[formatDate(l.createdAt),l.adminName,l.action,l.detail]));break;
    case 'saveSettings': adminSaveSettings();break;
    case 'changePw': adminChangePassword();break;
    case 'sendBroadcast': adminSendBroadcast();break;
    case 'backup': {
      const blob=new Blob([localStorage.getItem(STORAGE_KEY)||'{}'],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=`RentGo_Backup_${todayStamp()}.json`;a.click();
      URL.revokeObjectURL(url);
      logAdmin('Backup data','Unduh backup JSON');saveState();
      toast('Backup diunduh','success');break;
    }
    case 'resetAll': {
      const t=prompt('PERINGATAN: semua data (pengguna, motor, transaksi, chat, komisi) akan dihapus.\nKetik RESET untuk melanjutkan:');
      if(t!=='RESET'){if(t!==null)toast('Reset dibatalkan','info');return;}
      localStorage.removeItem(STORAGE_KEY);
      location.reload();break;
    }
  }
}

function adminRemind(sellerId,period){
  const owed=sellerUnpaidRentals(sellerId).filter(r=>periodOf(r.completedAt||r.createdAt)===period).reduce((s,r)=>s+(r.commission||0),0);
  if(owed<=0){toast('Tagihan sudah tidak ada','info');return;}
  pushNotif(sellerId,'warning','Pengingat Komisi',`Komisi ${periodLabel(period)} sebesar ${rupiah(owed)} belum dibayar. Jatuh tempo ${formatDateOnly(periodDueDate(period))}.`);
  logAdmin('Kirim pengingat',`${sellerName(sellerId)} · ${periodLabel(period)} · ${rupiah(owed)}`);
  saveState();
  toast('Pengingat terkirim','success');
}
function adminRemindAll(){
  const list=buildBills().filter(b=>b.overdue);
  if(list.length===0){toast('Tidak ada tagihan terlambat','info');return;}
  if(!confirm(`Kirim pengingat ke ${list.length} tagihan terlambat?`))return;
  list.forEach(b=>pushNotif(b.sellerId,'warning','Komisi Terlambat',`Komisi ${periodLabel(b.period)} sebesar ${rupiah(b.unpaidAmt)} sudah melewati jatuh tempo. Mohon segera dibayar.`));
  logAdmin('Pengingat massal',`${list.length} tagihan terlambat`);
  saveState();
  toast(`${list.length} pengingat terkirim`,'success');
}

function adminExportCommissions(){
  const rows=state.commissionPayments.slice().sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt)).map(c=>[
    sellerName(c.sellerId),periodLabel(c.period),c.rentalIds.length,c.amount,
    c.status,c.manual?'Manual':'Transfer',formatDate(c.submittedAt),c.reviewedAt?formatDate(c.reviewedAt):'',c.adminNote||''
  ]);
  if(rows.length===0){toast('Belum ada data untuk diexport','warning');return;}
  downloadCSV(`RentGo_Komisi_${todayStamp()}.csv`,['Penyedia','Periode','Jumlah Transaksi','Nominal','Status','Metode','Dikirim','Diproses','Catatan'],rows);
}
function adminExportUsers(){
  const rows=state.users.filter(u=>u.role!=='admin').map(u=>[
    u.name,u.email,u.phone||'',u.role==='seller'?'Penyedia':'Penyewa',u.suspended?'Ditangguhkan':'Aktif',
    u.role==='seller'?(u.balance||0):''
  ]);
  downloadCSV(`RentGo_Pengguna_${todayStamp()}.csv`,['Nama','Email','Telepon','Peran','Status','Saldo'],rows);
}
function adminExportRentals(){
  const rows=state.rentals.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(r=>{
    const m=state.motors.find(x=>x.id===r.motorId);
    return [r.id.slice(-8),m?m.brand+' '+m.name:'-',sellerName(r.buyerId),sellerName(r.sellerId),formatDate(r.createdAt),r.durationHours,r.totalPrice,(RENTAL_STATUS[r.status]||[r.status])[0],r.commission||0,r.status==='completed'?(r.commissionPaid?'Lunas':r.commissionPending?'Menunggu verifikasi':'Belum bayar'):''];
  });
  if(rows.length===0){toast('Belum ada data untuk diexport','warning');return;}
  downloadCSV(`RentGo_Transaksi_${todayStamp()}.csv`,['ID','Motor','Penyewa','Penyedia','Tanggal','Durasi (jam)','Total','Status','Komisi','Status Komisi'],rows);
}

function adminSaveSettings(){
  const rate=parseFloat(document.getElementById('setRate').value);
  const due=parseInt(document.getElementById('setDue').value);
  const bankName=document.getElementById('setBank').value.trim();
  const accountNumber=document.getElementById('setAcc').value.trim();
  const accountHolder=document.getElementById('setHolder').value.trim();
  if(!(rate>=1&&rate<=50)){toast('Komisi harus antara 1% – 50%','error');return;}
  if(!(due>=1&&due<=28)){toast('Tanggal jatuh tempo harus 1 – 28','error');return;}
  if(!bankName||!accountNumber||!accountHolder){toast('Data rekening platform wajib lengkap','error');return;}
  state.settings={commissionRate:rate/100,dueDay:due,bank:{bankName,accountNumber,accountHolder}};
  applySettings();
  logAdmin('Ubah pengaturan',`Komisi ${rate}% · jatuh tempo tgl ${due} · ${bankName} ${accountNumber}`);
  saveState();
  toast('Pengaturan disimpan','success');
  render();
}
function adminChangePassword(){
  const admin=state.users.find(u=>u.id===state.currentUser.id);
  const oldP=document.getElementById('pwOld').value;
  const n1=document.getElementById('pwNew').value;
  const n2=document.getElementById('pwNew2').value;
  if(oldP!==admin.password){toast('Password saat ini salah','error');return;}
  if(n1.length<8){toast('Password baru minimal 8 karakter','error');return;}
  if(n1!==n2){toast('Konfirmasi password tidak cocok','error');return;}
  admin.password=n1;
  logAdmin('Ganti password admin','');
  saveState();
  ['pwOld','pwNew','pwNew2'].forEach(i=>document.getElementById(i).value='');
  toast('Password admin diubah','success');
}
function adminSendBroadcast(){
  const target=document.getElementById('bcTarget').value;
  const title=document.getElementById('bcTitle').value.trim();
  const msg=document.getElementById('bcMsg').value.trim();
  if(!title||!msg){toast('Judul dan pesan wajib diisi','error');return;}
  const recipients=state.users.filter(u=>u.role!=='admin'&&(target==='all'||u.role===target));
  if(recipients.length===0){toast('Tidak ada penerima','warning');return;}
  if(!confirm(`Kirim pengumuman ke ${recipients.length} pengguna?`))return;
  recipients.forEach(u=>pushNotif(u.id,'booking','📢 '+title,msg));
  logAdmin('Kirim pengumuman',`${title} → ${target==='all'?'semua':target==='seller'?'penyedia':'penyewa'} (${recipients.length})`);
  saveState();
  toast(`Pengumuman terkirim ke ${recipients.length} pengguna`,'success');
  render();
}


let timerInterval=null;
function startTimers(){
  if(timerInterval)clearInterval(timerInterval);
  const tick=()=>{
    document.querySelectorAll('[data-timer]').forEach(el=>{
      const start=new Date(el.dataset.start).getTime();
      const durationMs=parseInt(el.dataset.duration)*3600*1000;
      const remaining=start+durationMs-Date.now();
      const timeEl=el.querySelector('[data-time]');
      if(!timeEl)return;
      if(remaining>=0){
        timeEl.textContent=formatTime(remaining);
        el.classList.remove('overdue');
      } else {
        timeEl.textContent=formatTime(Math.abs(remaining));
        el.classList.add('overdue');
      }
    });
  };
  tick();
  timerInterval=setInterval(tick,1000);
}

function render(){
  if(state.currentUser&&state.currentUser.suspended&&state.currentUser.role!=='admin'){
    state.currentUser=null;saveState();toast('Akun kamu ditangguhkan oleh admin','error');
  }
  if(!state.currentUser)renderAuth();
  else if(state.currentUser.role==='admin')renderAdmin();
  else if(state.currentUser.role==='buyer')renderBuyer();
  else renderSeller();
  startTimers();
}

loadState();
render();
syncBackend();
</script>
